version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: soroban-watchdog-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: soroban_watchdog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soroban-watchdog-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soroban-watchdog-app
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/soroban_watchdog?schema=public
      REDIS_URL: redis://redis:6379
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      ENCRYPTION_KEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
      POLL_INTERVAL_MS: 5000
      MAX_EVENTS_PER_BATCH: 100
      LOG_LEVEL: info
    ports:
      - "4000:4000"

volumes:
  pgdata:
  redisdata:
