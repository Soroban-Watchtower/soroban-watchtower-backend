title = "Soroban Watchtower Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for benign test fixtures, public Stellar addresses, and documentation"
paths = [
  '''^\.env\.example$''',
  '''^README\.md$''',
  '''^docs/.*''',
  '''^tests/.*''',
  '''^package-lock\.json$''',
  '''^node_modules/.*''',
  '''^dist/.*'''
]

regexes = [
  # Stellar Public Account Addresses (G...)
  '''G[A-Z0-9]{55}''',
  # Stellar Soroban Contract Addresses (C...)
  '''C[A-Z0-9]{55}''',
  # Standard Mock Hex Encryption Keys used in tests & sample env
  '''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
  # Webhook example URLs
  '''https://discord\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+''',
  '''https://api\.telegram\.org/bot''',
  '''https://webhook\.site/'''
]

stopwords = [
  "dummy",
  "0123456789abcdef",
  "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC",
  "GA7QYNF7SOWQ3GLR2BGMZEHXAVIRZA4KVWLTJJFC7MGXUA74P7UJVSGZ"
]
